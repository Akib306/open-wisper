[package]
name = "open-wisper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "OpenWisperRust"
path = "src/main.rs"

[dependencies]
wisper-core = { path = "../wisper-core" }
wisper-platform = { path = "../wisper-platform" }
libc = "0.2.177"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.3"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSObject", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPanel", "NSButton", "NSControl", "NSView", "NSWindow", "NSResponder", "NSEvent"] }
