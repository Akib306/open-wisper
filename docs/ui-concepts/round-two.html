<body>
<main class="gallery" id="round-two">
<header class="intro"><div><strong>Five more directions.</strong><p>A second round for Open Wisper. Five new compositions, not five new coats of paint.</p></div><button class="all" id="show-all" aria-pressed="true">All five</button></header>
<nav class="picker" aria-label="Second-round concepts"><button data-pick="command" aria-pressed="false">Command</button><button data-pick="index" aria-pressed="false">Index</button><button data-pick="ribbon" aria-pressed="false">Ribbon</button><button data-pick="carbon" aria-pressed="false">Carbon</button><button data-pick="classic" aria-pressed="false">Classic</button></nav>
<div id="concepts"></div>
<footer class="footer">UI studies only. Text, recording time, and settings are illustrative. Nothing records, inserts, or copies.<br>The original five concepts and both application implementations remain unchanged.</footer>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
</main>
<script>
const root=document.getElementById('round-two');
const concepts=[
{id:'command',name:'Command',tag:'A keyboard-first command palette.',note:'No home screen to navigate. A compact launcher turns dictation, transcript review, and settings into three direct actions.',chrome:'<strong>Open Wisper</strong><kbd>⌃ ⌥ Space</kbd>',ready:'<div class="prompt">Choose an action</div><button class="command-row" data-action="start"><span class="keymark" aria-hidden="true">D</span><span>Start dictation<small>Write at your cursor</small></span><kbd>Enter</kbd></button><button class="command-row" data-action="review"><span class="keymark" aria-hidden="true">T</span><span>Review current transcript<small>Nothing saved after dismissal</small></span><span class="row-end">Review</span></button><button class="command-row" data-action="settings"><span class="keymark" aria-hidden="true">S</span><span>Dictation settings</span><span class="row-end">Open</span></button><div class="ready-note">A quiet launcher. Not another workspace.</div>',foot:'<span>Processed on this Mac</span><span>No account needed</span>'},
{id:'index',name:'Index',tag:'Swiss clarity. A decisive red plane.',note:'Asymmetric typography meets a single full-height action. No sidebar, no cards: just language on the left and a deliberate control on the right.',chrome:'<strong>Open Wisper.</strong><span>Local dictation</span>',ready:'<div class="index-copy"><h3>Your voice,<br>in place.</h3><p>Place your cursor in a text field. Speak, stop, and keep moving.</p></div><button class="index-start" data-action="start"><span class="start-shape" aria-hidden="true"></span><span class="start-label">Start.</span><span class="start-detail">Start dictation<br>⌃ ⌥ Space</span></button>',foot:'<span>Voice → cursor</span><span>Your Mac. Your words.</span>'},
{id:'ribbon',name:'Ribbon',tag:'The app without the app window.',note:'A low-profile floating strip replaces the main window. Review and settings unfold beneath it only when requested. The smallest footprint in either round.',chrome:'',ready:'<p>Use from any text field. Stop to insert at the cursor.</p>',foot:'',bar:'<div class="ribbon-bar"><div class="monogram" aria-label="Open Wisper">w.</div><div class="ribbon-copy"><strong>Ready at your cursor</strong><small>Open Wisper · ⌃ ⌥ Space</small></div><button class="action" data-action="start">Start</button><button class="subtle" data-action="settings">Settings</button></div>'},
{id:'carbon',name:'Carbon',tag:'A focused canvas for your words.',note:'A warm charcoal transcript canvas with almost no chrome. Review is the visual center; controls sit at the edges instead of competing with the text.',initial:'review',chrome:'<strong>Open Wisper</strong><span>Current session</span>',ready:'<div class="ready-headline">A clean page.<br>A clear thought.</div><p>Dictate from any app. Open this canvas only when you want to review your words.</p><button class="action" data-action="start">Start dictation</button>',foot:'<span>Local processing · No history</span><span>⌃ ⌥ Space</span>'},
{id:'classic',name:'Classic',tag:'A one-bit Mac control panel.',note:'An intentionally retro instrument: square geometry, crisp black rules, simple controls, no color dependency. Familiar utility, very different visual language.',chrome:'<span class="close-box" aria-hidden="true"></span><strong>Open Wisper</strong>',ready:'<h3>Dictation</h3><div class="classic-status"><span class="dot" aria-hidden="true"></span>Ready to take dictation</div><p>Click into a text field, then press <kbd>⌃ ⌥ Space</kbd>. Your words are inserted when you stop.</p><div class="classic-actions"><button class="action" data-action="start">Start dictation</button><button class="subtle" data-action="settings">Settings…</button></div>',foot:'<span>On this Macintosh</span><span>No saved history</span>'}
];
const review='<h3>Current transcript</h3><div class="sample" tabindex="0">Let’s make this feel less like managing software, and more like getting a thought out of your head.</div><div class="sample-label">Sample transcript · Review and copy</div><div class="review-actions"><button class="subtle" data-action="dismiss">Dismiss</button><button class="action" data-action="copy">Copy text</button></div>';
const settings='<h3>Dictation settings</h3><div class="settings-list"><div class="setting"><span>Insert at cursor</span><span class="toggle" role="img" aria-label="Enabled in this concept"></span></div><div class="setting"><span>Shortcut</span><kbd>⌃ ⌥ Space</kbd></div><div class="setting"><span>Microphone</span><small>System default</small></div><div class="setting"><span>Transcription</span><small>Local engine</small></div></div><p class="settings-note">Clipboard paste is a fallback when direct insertion is unavailable. Transcripts aren’t saved.</p>';
document.getElementById('concepts').innerHTML=concepts.map(concept=>{const initial=concept.initial||'ready';return '<section class="study '+concept.id+'" id="'+concept.id+'" aria-label="'+concept.name+' concept"><header class="heading"><div><h2>'+concept.name+'</h2><p>'+concept.tag+'</p></div><nav class="views" aria-label="'+concept.name+' example screens">'+['ready','review','settings'].map(view=>'<button data-view="'+view+'" aria-pressed="'+(initial===view)+'">'+view[0].toUpperCase()+view.slice(1)+'</button>').join('')+'</nav></header><div class="stage"><div class="window" aria-label="'+concept.name+' mockup">'+(concept.chrome?'<div class="chrome">'+concept.chrome+'</div>':'')+(concept.bar||'')+'<div class="screen" data-screen="ready" '+(initial!=='ready'?'hidden':'')+'>'+concept.ready+'</div><div class="screen" data-screen="review" '+(initial!=='review'?'hidden':'')+'>'+review+'</div><div class="screen" data-screen="settings" hidden>'+settings+'</div>'+(concept.foot?'<div class="bottom">'+concept.foot+'</div>':'')+'</div><div class="recorder" aria-label="'+concept.name+' floating recording indicator sample"><span class="dot" aria-hidden="true"></span><span class="status">Recording</span><time>0:12</time><button data-action="stop">Stop</button><button class="cancel" data-action="cancel">Cancel</button></div><div class="caption">Matching floating indicator · separate recording-state sample</div></div><p class="rationale">'+concept.note+'</p></section>';}).join('');
function showView(study,view){study.querySelectorAll('[data-screen]').forEach(screen=>screen.hidden=screen.dataset.screen!==view);study.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));}
function showDesign(id){root.querySelectorAll('.study').forEach(study=>study.hidden=id!=='all'&&study.id!==id);root.querySelectorAll('[data-pick]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.pick===id)));document.getElementById('show-all').setAttribute('aria-pressed',String(id==='all'));document.getElementById('notice').textContent='';}
root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.pick){showDesign(button.dataset.pick);return;}if(button.id==='show-all'){showDesign('all');return;}const study=button.closest('.study');if(!study)return;if(button.dataset.view){showView(study,button.dataset.view);return;}const action=button.dataset.action;const notice=document.getElementById('notice');if(action==='review'||action==='settings'){showView(study,action);return;}if(action==='start'){study.querySelector('.status').textContent='Recording';notice.textContent='Recording appearance only. Your microphone is not in use.';}if(action==='stop'){showView(study,'review');study.querySelector('.status').textContent='Ready to review';notice.textContent='Sample review only. The real app would not automatically open this window.';}if(action==='cancel'||action==='dismiss'){showView(study,'ready');study.querySelector('.status').textContent='Cancelled';notice.textContent='Demo reset. Nothing was recorded or saved.';}if(action==='copy'){notice.textContent='Copy appearance only. Your clipboard has not changed.';}});
</script>
</body>
</html>
